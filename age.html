<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator | Hitung Umur</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
        }
        h1 { color: #764ba2; }
        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }
        button {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #5a67d8; }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f0f0f0;
            border-radius: 10px;
        }
        .umur { font-size: 28px; font-weight: bold; color: #764ba2; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📅 Age Calculator</h1>
        <p>Masukkan tanggal lahir Anda</p>
        
        <input type="date" id="birthdate">
        <button onclick="hitungUmur()">Hitung Umur</button>
        
        <div class="result" id="result" style="display:none;">
            <div class="umur" id="umurText"></div>
            <div id="detailText"></div>
        </div>
    </div>

    <script>
        function hitungUmur() {
            let tglLahir = document.getElementById('birthdate').value;
            if (!tglLahir) {
                alert("Pilih tanggal lahir dulu!");
                return;
            }
            
            let lahir = new Date(tglLahir);
            let sekarang = new Date();
            
            let tahun = sekarang.getFullYear() - lahir.getFullYear();
            let bulan = sekarang.getMonth() - lahir.getMonth();
            let hari = sekarang.getDate() - lahir.getDate();
            
            if (hari < 0) {
                bulan--;
                hari += new Date(sekarang.getFullYear(), sekarang.getMonth(), 0).getDate();
            }
            if (bulan < 0) {
                tahun--;
                bulan += 12;
            }
            
            document.getElementById('umurText').innerHTML = `${tahun} tahun`;
            document.getElementById('detailText').innerHTML = `${bulan} bulan, ${hari} hari`;
            document.getElementById('result').style.display = "block";
        }
    </script>
</body>
</html>
