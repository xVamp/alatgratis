<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator | Buat Password Kuat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background: #1e1e2f;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        h1 { color: #1e1e2f; text-align: center; }
        .password-box {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        #password {
            flex: 1;
            padding: 12px;
            font-size: 18px;
            font-family: monospace;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: center;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-generate {
            background: #3498db;
            color: white;
        }
        .btn-copy {
            background: #27ae60;
            color: white;
        }
        .option {
            margin: 15px 0;
        }
        .option label {
            display: inline-block;
            width: 120px;
        }
        input[type="number"] {
            width: 60px;
            padding: 5px;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 Password Generator</h1>
        <p>Buat password yang kuat dan aman</p>
        
        <div class="password-box">
            <input type="text" id="password" readonly value="Klik Generate">
            <button class="btn-generate" onclick="generatePassword()">Generate</button>
            <button class="btn-copy" onclick="copyPassword()">Salin</button>
        </div>
        
        <div class="option">
            <label>🔢 Panjang:</label>
            <input type="number" id="length" min="6" max="32" value="12">
        </div>
        <div class="option">
            <label><input type="checkbox" id="uppercase" checked> Huruf Besar (A-Z)</label>
        </div>
        <div class="option">
            <label><input type="checkbox" id="lowercase" checked> Huruf Kecil (a-z)</label>
        </div>
        <div class="option">
            <label><input type="checkbox" id="numbers" checked> Angka (0-9)</label>
        </div>
        <div class="option">
            <label><input type="checkbox" id="symbols" checked> Simbol (!@#$%^&*)</label>
        </div>
        
        <div class="footer">
            💡 Tips: Password minimal 12 karakter dengan kombinasi huruf, angka, dan simbol
        </div>
    </div>

    <script>
        function generatePassword() {
            let length = document.getElementById('length').value;
            let hasUpper = document.getElementById('uppercase').checked;
            let hasLower = document.getElementById('lowercase').checked;
            let hasNumbers = document.getElementById('numbers').checked;
            let hasSymbols = document.getElementById('symbols').checked;
            
            let chars = "";
            if (hasUpper) chars += "ABCDEFGHJKLMNPQRSTUVWXYZ";
            if (hasLower) chars += "abcdefghijkmnopqrstuvwxyz";
            if (hasNumbers) chars += "23456789";
            if (hasSymbols) chars += "!@#$%^&*()_+-=[]{}";
            
            if (chars === "") {
                alert("Pilih minimal satu jenis karakter!");
                return;
            }
            
            let password = "";
            for (let i = 0; i < length; i++) {
                let randomIndex = Math.floor(Math.random() * chars.length);
                password += chars[randomIndex];
            }
            
            document.getElementById('password').value = password;
        }
        
        function copyPassword() {
            let passwordField = document.getElementById('password');
            passwordField.select();
            document.execCommand('copy');
            alert("✅ Password berhasil disalin!");
        }
        
        // Generate pertama kali saat halaman dimuat
        window.onload = function() {
            generatePassword();
        };
    </script>
</body>
</html>
