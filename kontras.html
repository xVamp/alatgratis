<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemeriksa Warna Kontras | Accessibility Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #2c3e50;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
        }
        h1 { color: #2c3e50; text-align: center; }
        .color-box {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        .color-input {
            flex: 1;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        input[type="color"] {
            width: 100%;
            height: 50px;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
        }
        .preview {
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 18px;
        }
        .result {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }
        .pass { color: green; }
        .fail { color: red; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎨 Pemeriksa Kontras Warna</h1>
        <p>Cek apakah warna teks dan latar belakang mudah dibaca</p>
        
        <div class="color-box">
            <div class="color-input">
                <label>Warna Teks</label>
                <input type="color" id="textColor" value="#000000">
            </div>
            <div class="color-input">
                <label>Warna Latar</label>
                <input type="color" id="bgColor" value="#ffffff">
            </div>
        </div>
        
        <div class="preview" id="preview">
            Contoh Teks - Apakah mudah dibaca?
        </div>
        
        <div class="result" id="result">
            Pilih warna di atas
        </div>
        
        <p style="font-size: 12px; margin-top: 20px;">📖 Standar WCAG: Rasio kontras minimal 4.5:1 untuk teks normal.</p>
    </div>

    <script>
        const textColorInput = document.getElementById('textColor');
        const bgColorInput = document.getElementById('bgColor');
        const preview = document.getElementById('preview');
        const resultDiv = document.getElementById('result');
        
        function hexToRgb(hex) {
            let r = parseInt(hex.slice(1,3), 16);
            let g = parseInt(hex.slice(3,5), 16);
            let b = parseInt(hex.slice(5,7), 16);
            return [r, g, b];
        }
        
        function getLuminance(r, g, b) {
            let [rs, gs, bs] = [r, g, b].map(c => {
                c = c / 255;
                return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
            });
            return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
        }
        
        function getContrastRatio(hex1, hex2) {
            let rgb1 = hexToRgb(hex1);
            let rgb2 = hexToRgb(hex2);
            let lum1 = getLuminance(rgb1[0], rgb1[1], rgb1[2]);
            let lum2 = getLuminance(rgb2[0], rgb2[1], rgb2[2]);
            let brighter = Math.max(lum1, lum2);
            let darker = Math.min(lum1, lum2);
            return (brighter + 0.05) / (darker + 0.05);
        }
        
        function updateContrast() {
            let textColor = textColorInput.value;
            let bgColor = bgColorInput.value;
            
            // Update preview
            preview.style.color = textColor;
            preview.style.backgroundColor = bgColor;
            
            // Hitung rasio kontras
            let ratio = getContrastRatio(textColor, bgColor);
            let ratioFixed = ratio.toFixed(2);
            
            // Evaluasi
            let isPass = ratio >= 4.5;
            let status = isPass ? "✅ PASS (Memenuhi standar)" : "❌ FAIL (Kontras terlalu rendah)";
            let kelas = isPass ? "pass" : "fail";
            
            resultDiv.innerHTML = `<span class="${kelas}">Rasio Kontras: ${ratioFixed} : 1<br>${status}</span>`;
            
            if (ratio < 3) {
                resultDiv.innerHTML += "<br>⚠️ Teks sangat sulit dibaca!";
            } else if (ratio < 4.5) {
                resultDiv.innerHTML += "<br>⚠️ Hanya cocok untuk teks besar (18pt+)";
            }
        }
        
        textColorInput.addEventListener('input', updateContrast);
        bgColorInput.addEventListener('input', updateContrast);
        
        updateContrast(); // Jalankan pertama kali
    </script>
</body>
</html>
